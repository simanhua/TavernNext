name: Verify

on:
  push:
  pull_request:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --exclude '.worktrees/**'
      - run: npm run build
      - run: npm run verify:compat
      - run: npm run test:e2e
      - run: npm run smoke:local
